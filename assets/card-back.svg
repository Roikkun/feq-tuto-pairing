<svg viewBox="0 0 400 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1c2028"/>
      <stop offset="100%" stop-color="#0a0c0f"/>
    </linearGradient>
  </defs>
  <rect width="400" height="100" fill="url(#bg)"/>

  <!-- Cadre -->
  <rect x="4" y="4" width="392" height="92" fill="none" stroke="#c9a227" stroke-width="2"/>
  <rect x="11" y="11" width="378" height="78" fill="none" stroke="#c9a227" stroke-width="0.75" opacity="0.55"/>

  <!-- Losanges d'angle (décoratifs, peuvent être rognés sans perte de sens) -->
  <g fill="#c9a227">
    <rect x="1.5" y="1.5" width="7" height="7" transform="rotate(45 5 5)"/>
    <rect x="391.5" y="1.5" width="7" height="7" transform="rotate(45 395 5)"/>
    <rect x="1.5" y="91.5" width="7" height="7" transform="rotate(45 5 95)"/>
    <rect x="391.5" y="91.5" width="7" height="7" transform="rotate(45 395 95)"/>
  </g>

  <!-- Motif central : toujours visible, même très rogné sur les côtés -->
  <rect x="168" y="18" width="64" height="64" transform="rotate(45 200 50)" fill="none" stroke="#c9a227" stroke-width="2"/>
  <g fill="#c9a227">
    <path d="M200 25 L207 46 L228 50 L207 54 L200 75 L193 54 L172 50 L193 46 Z"/>
    <circle cx="200" cy="50" r="6" fill="#0a0c0f"/>
    <circle cx="200" cy="50" r="6" fill="none" stroke="#c9a227" stroke-width="1.4"/>
  </g>
</svg>
